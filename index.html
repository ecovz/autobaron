<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0c14">
<title>Автобарон</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#cfe0f7;color:#0f2447;font:15px/1.35 'Russo One',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
header{background:linear-gradient(#4f8ff7,#2563eb);border-bottom:3px solid #0b2a6b;padding:8px 10px 6px;position:relative;z-index:2}
.tb{display:flex;gap:6px;align-items:center}
.pl{flex:1;background:#1e40af;border:2px solid #0b2a6b;border-radius:20px;padding:4px 8px;color:#fff;font-size:14px;white-space:nowrap;box-shadow:inset 0 -3px 0 #0003}
#cash{color:#fde047;display:inline-block}
.pop{animation:pp .35s ease-out}@keyframes pp{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.sm{min-height:18px;color:#fff;font-size:12px;padding:3px 4px 0}
#sc{line-height:0;flex:none}
main{flex:1;overflow:auto;padding:0 12px 14px}
h3{margin:14px 2px 8px;font-size:16px;font-weight:400;color:#0b2a6b;letter-spacing:.5px}
.mu{color:#4b6288;font-size:13px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cd{background:#f6f9ff;border:3px solid #0b2a6b;border-radius:18px;padding:10px;margin-bottom:12px;box-shadow:inset 7px 0 0 var(--k,#7aa7ff),0 4px 0 #0b2a6b}
.cr{display:flex;gap:10px;align-items:center}.ci{flex:1;min-width:0}
.car{width:92px;flex:none;background:linear-gradient(#bfe3ff,#e8f6ff);border:2px solid #0b2a6b;border-radius:12px;padding:4px}
button{--sh:#0b2a6b;font:inherit;color:#fff;border:3px solid var(--sh);border-radius:14px;padding:10px 12px;background:linear-gradient(#7cb2ff,#2f6fe0);text-shadow:0 2px 0 var(--sh);box-shadow:0 4px 0 var(--sh);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.p{--sh:#064e1f;background:linear-gradient(#5eea8a,#16a34a)}
.o{--sh:#7c2d12;background:linear-gradient(#ffc36b,#f97316)}
.w{width:100%;margin-top:8px}.ib{width:38px;height:38px;padding:0;font-size:18px;background:#f1f5f9;text-shadow:none}
.bar{height:12px;background:#cbd5e1;border:2px solid #0b2a6b;border-radius:8px;margin:6px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#5eea8a,#16a34a);transition:width 1s linear}
.bar.lo i{background:linear-gradient(#ff8a8a,#dc2626)}
nav{display:flex;gap:6px;padding:10px 8px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(#4f8ff7,#2563eb);border-top:3px solid #0b2a6b}
nav button{flex:1;padding:6px 0 4px;font-size:11px;display:flex;flex-direction:column;align-items:center;border-radius:14px}
nav button span{font-size:26px;line-height:1.1}
nav button:nth-child(1){--sh:#064e1f;background:linear-gradient(#5eea8a,#16a34a)}
nav button:nth-child(3){--sh:#3b1a7a;background:linear-gradient(#c4a1ff,#7c3aed)}
nav button:nth-child(4){--sh:#7c2d12;background:linear-gradient(#ffc36b,#f97316)}
nav button.on{transform:translateY(-5px) scale(1.07);filter:brightness(1.12)}
.fl{position:fixed;left:0;right:0;top:26%;text-align:center;font-size:34px;-webkit-text-stroke:2px #0b2a6b;paint-order:stroke fill;text-shadow:0 3px 0 #0b2a6b;pointer-events:none;z-index:9;animation:fl 1.1s ease-out forwards}
@keyframes fl{to{transform:translateY(-90px) scale(1.2);opacity:0}}
.coin{position:fixed;top:-30px;font-size:26px;pointer-events:none;z-index:9;animation:cn 1.3s ease-in forwards}
@keyframes cn{to{transform:translateY(110vh) rotate(420deg);opacity:.3}}
body.sh{animation:sh .28s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.bob{animation:bb 1.6s ease-in-out infinite}@keyframes bb{50%{transform:translateY(-3px)}}
.cl{animation:cl 38s linear infinite}@keyframes cl{from{transform:translateX(-90px)}to{transform:translateX(470px)}}
.rain line{stroke:#e0f2fe;stroke-width:1.6;animation:rn .75s linear infinite}@keyframes rn{from{transform:translateY(-14px)}to{transform:translateY(150px)}}
.sun{animation:sn 3s ease-in-out infinite;transform-origin:320px 24px}@keyframes sn{50%{transform:scale(1.12)}}
#sp{position:fixed;inset:0;z-index:20;background:linear-gradient(#4aa8ff,#cfe9ff 62%,#6fae52 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#sp.x{opacity:0;pointer-events:none}
.lg{font-size:44px;color:#fde047;-webkit-text-stroke:3px #0b2a6b;paint-order:stroke fill;text-shadow:0 5px 0 #0b2a6b;letter-spacing:2px;animation:bn 1.6s ease-in-out infinite}.lg b{color:#fff;font-weight:400}
@keyframes bn{50%{transform:translateY(-8px)}}
.tp{color:#fff;font-size:18px;text-shadow:0 2px 0 #0b2a6b;animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.3}}
</style></head><body>
<div id="sp"><div class="lg">АВТО<b>БАРОН</b></div><div id="spc"></div><div class="tp">Нажми, чтобы начать</div></div>
<header><div class="tb"><div class="pl">💵 <span id="cash"></span></div><div class="pl">🚗 <span id="stk"></span></div><div class="pl">⭐ <span id="sld"></span></div><button class="ib" data-a="mus" id="bm">🎵</button><button class="ib" data-a="snd" id="bs">🔊</button></div><div class="sm" id="sm"></div></header><div id="sc"></div>
<main id="m"></main><nav id="nv"></nav>
<script>
const CLS=[{n:'Эконом',b:[4e3,9e3],u:0},{n:'Комфорт',b:[14e3,28e3],u:1},{n:'Премиум',b:[4e4,8e4],u:3},{n:'Люкс',b:[11e4,25e4],u:5}];
const MD=[['Lada Vesta','Kia Rio','Renault Logan','Hyundai Solaris'],['Toyota Camry','Mazda 6','Skoda Superb','VW Passat'],['BMW 5','Audi A6','Mercedes E','Lexus ES'],['Porsche 911','Bentley GT','Mercedes S','Ferrari Roma']];
const HN=['Комната в общаге','Квартира','Дом','Коттедж','Особняк'],HC=[0,8e3,4e4,15e4,6e5];
const PN=['Пешком','Lada Granta','Toyota Camry','BMW M5','Porsche 911','Bugatti Chiron'],PC=[0,6e3,3e4,12e4,45e4,2e6];
const COL=['#94a3b8','#2dd4bf','#a78bfa','#fbbf24'];
const $=id=>document.getElementById(id),R=Math.random;
const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' $';
const OL='stroke="#0b2a6b" stroke-width="2.5" stroke-linejoin="round"';
const cb=col=>'<path d="M8 34h104v-8l-14-4-14-10H44L30 22l-18 4z" fill="'+col+'" '+OL+'/><path d="M46 14h22l10 8H38z" fill="#bfe3ff" '+OL+'/><path d="M14 28h92" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><circle cx="32" cy="36" r="8" fill="#1f2937" '+OL+'/><circle cx="90" cy="36" r="8" fill="#1f2937" '+OL+'/><circle cx="32" cy="36" r="3" fill="#cbd5e1"/><circle cx="90" cy="36" r="3" fill="#cbd5e1"/>';
const car=c=>'<svg viewBox="0 0 120 50" class="car">'+cb(COL[c])+'</svg>';
const AV=['😎','🤠','👨‍💼','👩‍💼','🧔','👵'],PCOL=['','#9ca3af','#e5e7eb','#ef4444','#a855f7','#fbbf24'];
function house(l){const s=OL,w=(x,y,c)=>'<rect x="'+x+'" y="'+y+'" width="14" height="12" rx="2" fill="'+c+'" '+s+'/>';
if(l==0)return '<rect x="215" y="76" width="100" height="36" fill="#d8ccb0" '+s+'/><path d="M208 78l57-26 57 26z" fill="#8b95a1" '+s+'/><rect x="262" y="88" width="42" height="24" fill="#3b3f4a" '+s+'/>'+w(226,88,'#9ec5e8')+'<path d="M230 90l8 8m0-8l-8 8" stroke="#0b2a6b" stroke-width="1.5"/>';
if(l==1)return '<rect x="228" y="46" width="76" height="66" fill="#cdd7e4" '+s+'/>'+[0,1,2].map(r=>[0,1,2].map(c=>w(234+c*23,54+r*19,(r+c)%2?'#fde68a':'#bfdbfe')).join('')).join('');
if(l==2)return '<rect x="212" y="68" width="106" height="44" fill="#f6e7c6" '+s+'/><path d="M204 70l61-30 61 30z" fill="#c2410c" '+s+'/><rect x="236" y="48" width="12" height="18" fill="#9a3412" '+s+'/><rect x="256" y="86" width="18" height="26" rx="3" fill="#7c4a21" '+s+'/>'+w(222,84,'#fde68a')+w(288,84,'#fde68a');
if(l==3)return '<rect x="198" y="66" width="130" height="46" fill="#bba98c" '+s+'/><rect x="198" y="52" width="130" height="14" fill="#a16207" '+s+'/><path d="M190 54l73-26 73 26z" fill="#3f3f46" '+s+'/>'+[0,1,2,3].map(i=>w(208+i*30,80,'#fde047')).join('')+'<rect x="252" y="90" width="22" height="22" rx="3" fill="#78350f" '+s+'/>';
return '<rect x="182" y="58" width="168" height="54" fill="#f8fafc" '+s+'/><path d="M174 60h184l-14-18H188z" fill="#f59e0b" '+s+'/>'+[0,1,2,3,4].map(i=>'<rect x="'+(190+i*31)+'" y="70" width="18" height="30" rx="2" fill="#fde047" '+s+'/>').join('')+'<rect x="257" y="84" width="20" height="28" fill="#92400e" '+s+'/>'}
function scene(){const h=S.house,p=S.pcar,sk=[['#7b8794','#b4bec9'],['#7fb4e8','#d4e8fb'],['#5fb0f5','#d9f1ff'],['#4aa8ff','#e6f7ff'],['#ff9f6b','#ffe7ae']][h];
let r='<svg viewBox="0 0 380 150" width="100%"><defs><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+sk[0]+'"/><stop offset="1" stop-color="'+sk[1]+'"/></linearGradient></defs><rect width="380" height="150" fill="url(#gs)"/>';
if(h>=2)r+='<g class="sun"><circle cx="320" cy="24" r="'+(h==4?20:15)+'" fill="#fde047" '+OL+'/></g>';
r+='<g class="cl"><ellipse cx="60" cy="26" rx="26" ry="10" fill="#fff" opacity=".9"/><ellipse cx="80" cy="20" rx="18" ry="9" fill="#fff" opacity=".9"/></g><g class="cl" style="animation-delay:-19s"><ellipse cx="60" cy="48" rx="22" ry="8" fill="#fff" opacity=".8"/></g>';
r+='<rect y="112" width="380" height="38" fill="'+['#6b7f4a','#6fae52','#6fae52','#7bc65a','#4fa84a'][h]+'"/><rect y="112" width="380" height="3" fill="#0b2a6b"/>'+house(h);
if(p)r+='<g transform="translate(76,80) scale(.82)" style="'+(p==5?'filter:drop-shadow(0 0 6px #fde047)':'')+'"><g class="bob">'+cb(PCOL[p])+'</g></g>';
r+='<g class="bob"><ellipse cx="38" cy="114" rx="18" ry="4" fill="#0003"/><rect x="26" y="74" width="24" height="32" rx="8" fill="'+(h>=3?'#16a34a':'#f1f5f9')+'" '+OL+'/><rect x="28" y="104" width="8" height="10" fill="#334155"/><rect x="40" y="104" width="8" height="10" fill="#334155"/><circle cx="38" cy="62" r="14" fill="#c68642" '+OL+'/>'+(h>=2?'<rect x="26" y="58" width="24" height="7" rx="3" fill="#111"/>':'<circle cx="33" cy="61" r="2" fill="#111"/><circle cx="43" cy="61" r="2" fill="#111"/>')+'<path d="M32 68q6 5 12 0" stroke="#111" stroke-width="2" fill="none"/>'+(h>=3?'<path d="M30 78q8 10 16 0" stroke="#fbbf24" stroke-width="3" fill="none"/>':'')+'</g>';
if(h<2){r+='<g class="rain">';for(let i=0;i<16;i++)r+='<line x1="'+(i*24+R()*8)+'" y1="0" x2="'+(i*24-4)+'" y2="12" style="animation-delay:-'+(i*.13).toFixed(2)+'s"/>';r+='</g>'}
return r+'</svg>'}
const TG=window.Telegram&&Telegram.WebApp;
try{TG&&(TG.ready(),TG.expand())}catch(e){}
const cs=()=>{try{return TG&&TG.CloudStorage&&TG.isVersionAtLeast('6.9')?TG.CloudStorage:0}catch(e){return 0}};
const hap=t=>{try{const h=TG&&TG.HapticFeedback;if(!h)return;t=='error'||t=='success'?h.notificationOccurred(t):h.impactOccurred('light')}catch(e){}};
const O={s:1,m:1};let ac;
function snd(n){if(!O.s)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();const P={sell:[[988,.09],[1319,.2]],buy:[[440,.07],[560,.1]],up:[[523,.1],[659,.1],[784,.1],[1047,.28]],err:[[160,.2,'square']],tap:[[620,.04]]}[n];let t=ac.currentTime;P.forEach(([f,d,w])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=w||'triangle';o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
const bg=new Audio('music.mp3');bg.loop=true;bg.volume=.3;
function mus(){try{if(O.m){const p=bg.play();p&&p.catch(()=>{})}else bg.pause()}catch(e){}}
function pop(t,c){const e=document.createElement('div');e.className='fl';e.textContent=t;e.style.color=c;document.body.appendChild(e);setTimeout(()=>e.remove(),1100)}
function coins(){for(let i=0;i<10;i++){const e=document.createElement('div');e.className='coin';e.textContent='🪙';e.style.left=R()*92+'%';e.style.animationDelay=R()*.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}}
function fresh(){return{cash:1e4,sold:0,stock:[],lots:[],cust:[],up:{wh:0,show:0,ad:0,mgr:0,sup:0},house:0,pcar:0,id:1,t:{lot:0,cus:3,mgr:12}}}
const pack=()=>({c:S.cash,s:S.sold,u:S.up,h:S.house,p:S.pcar,i:S.id,o:O,k:S.stock.map(x=>[x.c,x.n,x.b,x.q,x.paid])});
function unpack(o){const f=fresh();f.cash=o.c;f.sold=o.s;f.up=Object.assign(f.up,o.u);f.house=o.h;f.pcar=o.p;f.id=o.i||1;f.stock=(o.k||[]).map(a=>({id:f.id++,c:a[0],n:a[1],b:a[2],q:a[3],paid:a[4]}));if(o.o)Object.assign(O,o.o);return f}
function save(){const d=JSON.stringify(pack());try{localStorage.setItem('ab1',d)}catch(e){}const C=cs();if(C&&d.length<4000)C.setItem('ab',d,()=>{})}
let S=fresh(),tab=0,dirty=1,msg='',mt=0,rs=0,lc=0;
try{const x=JSON.parse(localStorage.getItem('ab1'));if(x)S=unpack(x)}catch(e){}
const say=m=>{msg=m;mt=Date.now()},bad=m=>{say(m);snd('err');hap('error');document.body.classList.add('sh');setTimeout(()=>document.body.classList.remove('sh'),300)};
const cap=()=>4+3*S.up.wh;
const mx=()=>{let m=0;CLS.forEach((c,i)=>{if(c.u<=S.up.show)m=i});return m};
const val=c=>c.b*(.4+.6*c.q/100);
const mar=()=>.1+.04*S.up.show+.03*S.house;
const iv=l=>14*Math.pow(.85,l)/(1+.08*S.pcar);
const price=(c,u)=>val(c)*(1+mar())*u.r;
const rc=c=>Math.round(c.b*(100-c.q)/100*.3);
const pick=k=>S.stock.filter(c=>c.c==k).sort((a,b)=>val(b)-val(a))[0];
const UP=[
{k:'wh',n:'🏭 Склад',d:l=>'Мест: '+(4+3*l)+' → '+(7+3*l),b:1500,m:1.7,x:8},
{k:'show',n:'🏢 Шоурум',d:l=>'Наценка +4%'+(l==0?', открывает класс «Комфорт»':l==2?', открывает класс «Премиум»':l==4?', открывает класс «Люкс»':''),b:3e3,m:2,x:6},
{k:'ad',n:'📣 Реклама',d:l=>'Клиент раз в '+iv(l).toFixed(0)+' с → '+iv(l+1).toFixed(0)+' с',b:2e3,m:1.8,x:8},
{k:'mgr',n:'🧑‍💼 Менеджеры',d:l=>'Автопродажа: '+(l?'раз в '+(12/l).toFixed(0)+' с':'нет')+' → раз в '+(12/(l+1)).toFixed(0)+' с',b:5e3,m:2,x:6},
{k:'sup',n:'🤝 Поставщики',d:l=>'Скидка на аукционе −'+3*l+'% → −'+3*(l+1)+'%',b:4e3,m:2.2,x:5}];
function mk(){const i=Math.floor(R()*(mx()+1)),k=CLS[i];return{id:S.id++,c:i,n:MD[i][Math.floor(R()*4)],b:Math.round((k.b[0]+R()*(k.b[1]-k.b[0]))/100)*100,q:Math.round(55+R()*45)}}
function lots(){S.lots=[];for(let i=0;i<6;i++){const c=mk();c.p=Math.round(val(c)*(.68+.2*R())*(1-.03*S.up.sup));S.lots.push(c)}}
function addCust(){S.cust.push({id:S.id++,c:Math.floor(R()*(mx()+1)),pat:40,r:.92+R()*.2})}
function sell(u,auto){const c=pick(u.c);if(!c)return;const p=price(c,u),g=p-c.paid;S.cash+=p;S.sold++;S.stock=S.stock.filter(x=>x!==c);S.cust=S.cust.filter(x=>x!==u);say((auto?'Менеджер: ':'')+'продан '+c.n+' за '+fmt(p));snd('sell');hap('success');pop((g>=0?'+':'')+fmt(g),g>=0?'#fbbf24':'#f87171');if(!auto)coins()}
function auto(){for(const u of S.cust){if(pick(u.c)){sell(u,1);break}}}
function buyUp(p,f,m){if(S.cash<p)return bad('Не хватает денег');S.cash-=p;f();say(m);snd('up');hap('success');pop('Улучшено!','#22d3ee')}
const A={
tab:i=>{tab=+i;snd('tap')},
mus:()=>{O.m=!O.m;mus();sync()},snd:()=>{O.s=!O.s;sync();snd('tap')},
sell:i=>{const u=S.cust.find(x=>x.id==i);if(!u)return;if(!pick(u.c))bad('Нет подходящей машины на складе');else sell(u)},
buy:i=>{const l=S.lots.find(x=>x.id==i);if(!l)return;if(S.stock.length>=cap())return bad('Склад полон. Улучши его или продай машины');if(S.cash<l.p)return bad('Не хватает денег');S.cash-=l.p;l.paid=l.p;S.stock.push(l);S.lots=S.lots.filter(x=>x!==l);say('Куплен '+l.n);snd('buy');hap('light')},
rep:i=>{const c=S.stock.find(x=>x.id==i);if(!c)return;const p=rc(c);if(S.cash<p)return bad('Не хватает денег');S.cash-=p;c.paid+=p;c.q=100;say(c.n+' отремонтирован');snd('buy');hap('light')},
dump:i=>{const c=S.stock.find(x=>x.id==i);if(!c)return;S.cash+=val(c)*.85;S.stock=S.stock.filter(x=>x!==c);say('Срочная продажа: '+c.n);snd('sell')},
refresh:()=>{if(S.cash<300)return bad('Нужно 300 $');S.cash-=300;lots();S.t.lot=30;snd('tap')},
up:k=>{const u=UP.find(x=>x.k==k),l=S.up[k];if(l>=u.x)return;buyUp(Math.round(u.b*Math.pow(u.m,l)),()=>S.up[k]++,u.n+': уровень '+(l+1))},
house:()=>{const p=HC[S.house+1];if(p)buyUp(p,()=>S.house++,'Новое жильё: '+HN[S.house+1])},
pcar:()=>{const p=PC[S.pcar+1];if(p)buyUp(p,()=>S.pcar++,'Новая тачка: '+PN[S.pcar+1])},
reset:()=>{if(rs){S=fresh();lots();rs=0;msg='';save()}else rs=1}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;A[b.dataset.a](b.dataset.i);dirty=1;hud();render()});
$('spc').innerHTML='<svg viewBox="0 0 120 50" style="width:230px;animation:bn 1.2s ease-in-out infinite">'+cb('#fbbf24')+'</svg>';
$('sp').onclick=()=>{$('sp').classList.add('x');snd('tap');mus()};
function sync(){$('bm').style.opacity=O.m?1:.35;$('bs').style.opacity=O.s?1:.35}
let sk0='';
function hud(){const up=S.cash>lc;lc=S.cash;const c=$('cash');c.textContent=fmt(S.cash);if(up){c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}$('stk').textContent=S.stock.length+'/'+cap();$('sld').textContent=S.sold;$('sm').textContent=Date.now()-mt<5e3?msg:'';const k=S.house+'-'+S.pcar;if(k!=sk0){sk0=k;$('sc').innerHTML=scene()}}
function nav(){$('nv').innerHTML=[['🚗','Продажи'],['🔨','Аукцион'],['📈','Развитие'],['🏠','Жизнь']].map((t,i)=>'<button data-a="tab" data-i="'+i+'"'+(i==tab?' class="on"':'')+'><span>'+t[0]+'</span>'+t[1]+'</button>').join('')}
const row=(c,t1,t2,t3,b)=>'<div class="cd" style="--k:'+COL[c]+'"><div class="cr">'+car(c)+'<div class="ci"><div class="r"><b>'+t1+'</b><span class="mu">'+t2+'</span></div><div class="mu">'+t3+'</div></div></div>'+b+'</div>';
function render(){dirty=0;nav();let h='';
if(tab==0){
h+='<h3>КЛИЕНТЫ</h3>';
if(!S.cust.length)h+='<p class="mu">Ждём клиентов…</p>';
S.cust.forEach(u=>{const c=pick(u.c);h+=row(u.c,AV[u.id%6]+' Ищет: '+CLS[u.c].n,c?fmt(price(c,u)):'нет в наличии','<div class="bar'+(u.pat<10?' lo':'')+'"><i data-p="'+u.id+'" style="width:'+u.pat/.4+'%"></i></div>','<button class="w'+(c?' p':'')+'" data-a="sell" data-i="'+u.id+'">'+(c?'Продать '+c.n:'Нет подходящей машины')+'</button>')});
h+='<h3>СКЛАД ('+S.stock.length+'/'+cap()+')</h3>';
if(!S.stock.length)h+='<p class="mu">Пусто. Купи машины на аукционе.</p>';
S.stock.forEach(c=>{h+=row(c.c,c.n,CLS[c.c].n+' · '+c.q+'%','Рынок '+fmt(val(c))+' · куплена за '+fmt(c.paid),'<div class="r">'+(c.q<100?'<button class="w" data-a="rep" data-i="'+c.id+'">Ремонт '+fmt(rc(c))+'</button>':'')+'<button class="w o" data-a="dump" data-i="'+c.id+'">Срочно '+fmt(val(c)*.85)+'</button></div>')})
}else if(tab==1){
h+='<h3>АУКЦИОН</h3><p class="mu">Новые лоты через <span id="lt">'+S.t.lot+'</span> с. Чем хуже состояние, тем дешевле: отремонтируй и продай дороже.</p>';
S.lots.forEach(c=>{h+=row(c.c,c.n,CLS[c.c].n+' · '+c.q+'%','Рыночная цена '+fmt(val(c)),'<button class="w p" data-a="buy" data-i="'+c.id+'">Купить за '+fmt(c.p)+'</button>')});
h+='<button class="w" data-a="refresh">Обновить лоты · 300 $</button>'
}else if(tab==2){
h+='<h3>РАЗВИТИЕ БИЗНЕСА</h3>';
UP.forEach(u=>{const l=S.up[u.k],p=Math.round(u.b*Math.pow(u.m,l));h+='<div class="cd"><div class="r"><b>'+u.n+'</b><span class="mu">ур. '+l+'/'+u.x+'</span></div><div class="mu">'+(l>=u.x?'Максимальный уровень':u.d(l))+'</div>'+(l>=u.x?'':'<button class="w p" data-a="up" data-i="'+u.k+'">Улучшить · '+fmt(p)+'</button>')+'</div>'})
}else{
h+='<h3>ЛИЧНАЯ ЖИЗНЬ</h3>';
if(S.house==4&&S.pcar==5)h+='<div class="cd" style="--k:#fbbf24"><b>👑 Ты король автобизнеса!</b><div class="mu">Особняк и Bugatti: цель достигнута. Играй дальше.</div></div>';
const hp=HC[S.house+1],pp=PC[S.pcar+1];
h+='<div class="cd"><div class="r"><b>🏠 '+HN[S.house]+'</b><span class="mu">ур. '+S.house+'/4</span></div><div class="mu">Каждый уровень: +3% к наценке и +1 место в очереди клиентов</div>'+(hp?'<button class="w p" data-a="house">'+HN[S.house+1]+' · '+fmt(hp)+'</button>':'')+'</div>';
h+='<div class="cd"><div class="r"><b>🚘 '+PN[S.pcar]+'</b><span class="mu">ур. '+S.pcar+'/5</span></div><div class="mu">Каждый уровень: клиенты приходят на 8% чаще</div>'+(pp?'<button class="w p" data-a="pcar">'+PN[S.pcar+1]+' · '+fmt(pp)+'</button>':'')+'</div>';
h+='<button class="w o" data-a="reset">'+(rs?'Точно? Нажми ещё раз':'Начать заново')+'</button>'
}
const m=$('m'),sc=m.scrollTop;m.innerHTML=h;m.scrollTop=sc}
let sv=0;
setInterval(()=>{const t=S.t;
if(--t.lot<=0){lots();t.lot=30;dirty=1}
if(--t.cus<=0&&S.cust.length<3+S.house){addCust();t.cus=iv(S.up.ad);dirty=1}
S.cust.forEach(c=>c.pat--);const n=S.cust.length;S.cust=S.cust.filter(c=>c.pat>0);if(n!=S.cust.length)dirty=1;
if(S.up.mgr&&--t.mgr<=0){auto();t.mgr=12/S.up.mgr;dirty=1}
hud();
if(dirty)render();else{document.querySelectorAll('[data-p]').forEach(e=>{const c=S.cust.find(x=>x.id==e.dataset.p);if(c){e.style.width=c.pat/.4+'%';if(c.pat<10)e.parentNode.classList.add('lo')}});const l=$('lt');if(l)l.textContent=t.lot}
if(++sv%5==0)save()},1000);
document.addEventListener('visibilitychange',save);
const C0=cs();if(C0)C0.getItem('ab',(e,v)=>{try{if(!e&&v){const x=JSON.parse(v);if(x.s>=S.sold){S=unpack(x);lots();dirty=1;sync()}}}catch(er){}});
lots();sync();hud();render();
</script></body></html>
